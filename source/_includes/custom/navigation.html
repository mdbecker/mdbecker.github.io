<ul class="nav">
  {% for link in site.navigation %}
    {% assign active = nil %}
    {% if link.url == '/blog/' %}
      {% if page.url contains '/blog/' %}{% assign active = 'true' %}{% endif %}
    {% endif %}
    {% if page.url == link.url %}{% assign active = 'page' %}{% endif %}
    <li><a href="{{ link.url | relative_url }}" title="{{ link.text | escape }}"{% if active %} aria-current="{{ active }}"{% endif %}>{{ link.text | escape }}</a></li>
  {% endfor %}
</ul>
