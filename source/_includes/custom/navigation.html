<ul class="nav">
  {% for link in site.navigation %}
    {% assign active = false %}
    {% if page.url == link.url %}{% assign active = true %}{% endif %}
    {% if link.url == '/' and page.layout == 'post' %}{% assign active = true %}{% endif %}
    <li><a href="{{ link.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ link.text | escape }}</a></li>
  {% endfor %}
</ul>
