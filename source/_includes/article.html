<header>
  <h1>{{ page.display_title | default: page.title | escape }}</h1>
  {% assign article = page %}
  <p class="meta">
    <time datetime="{{ article.date | date_to_xmlschema }}">{{ article.date | date: "%b %-d, %Y" }}</time>
    <span class="categories">{% for category in article.categories limit:3 %} · {% include category_link.html category=category %}{% endfor %}</span>
  </p>
</header>
{% include article_content.html %}
