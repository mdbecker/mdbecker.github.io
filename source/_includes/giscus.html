{% if page.comments == true and site.giscus.repo != empty and site.giscus.repo and site.giscus.repo_id != empty and site.giscus.repo_id and site.giscus.category != empty and site.giscus.category and site.giscus.category_id != empty and site.giscus.category_id %}
<section class="comments" aria-label="Comments">
  <h2>Comments</h2>
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo | escape }}"
    data-repo-id="{{ site.giscus.repo_id | escape }}"
    data-category="{{ site.giscus.category | escape }}"
    data-category-id="{{ site.giscus.category_id | escape }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="light"
    data-lang="en"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
  <noscript>Comments require JavaScript and a GitHub account.</noscript>
</section>
{% endif %}
