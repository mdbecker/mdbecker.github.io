<p class="meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time></p>
<h3><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>
<p class="meta categories">{% assign categories = post.categories | sort %}{% for category in categories %}<a href="{{ root_url }}/{{ site.category_dir }}/{{ category | replace:' ','-' | replace:'.','-dot-' | downcase | slugify }}/">{{ category | escape }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}</p>
