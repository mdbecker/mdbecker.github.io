---
layout: default
---
<article>
  {% if page.title %}
  <header>
    <h1>{{ page.display_title | default: page.title | escape }}</h1>
    {% if page.date %}<p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time></p>{% endif %}
  </header>
  {% endif %}
  {% include article_content.html %}
</article>
