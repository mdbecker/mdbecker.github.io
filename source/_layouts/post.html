---
layout: default
---
<article class="hentry">
  {% include article.html %}
  <footer class="post-footer">
    <nav aria-label="Adjacent articles">
      {% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">&laquo; {{ page.previous.title | escape }}</a>{% endif %}
      {% if page.next.url %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }} &raquo;</a>{% endif %}
    </nav>
  </footer>
</article>
