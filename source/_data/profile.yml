name: Michael Becker
role: Lead Machine Learning Engineer
organization: Penn Medicine
organization_url: https://www.pennmedicine.org/
intro: >-
  I work on turning machine learning and AI into useful, production systems for healthcare.
focus: >-
  I'm interested in the part after the model works: deploying it, integrating it into real workflows, measuring whether it helps, and keeping it reliable.
community: >-
  I co-founded DataPhilly and help connect people working with data and AI in Philadelphia.
now: >-
  My focus is production healthcare ML and AI: reliable applications and evaluation, retrieval and LLM-based systems, secure clinical workflow integration, and applied research. I also stay involved with DataPhilly and the local data community.
