name: Michael Becker
role: Lead Machine Learning Engineer
organization: Penn Medicine
organization_url: https://www.pennmedicine.org/
intro: >-
  I work on making machine learning and AI useful in healthcare.
focus: >-
  Getting a model to work is a start. I'm interested in deploying models, fitting them into real workflows, measuring whether they help, and keeping them reliable.
community: >-
  I co-founded DataPhilly and help connect people working with data and AI in Philadelphia.
now: >-
  I'm focused on getting ML and AI into production in healthcare. I build reliable applications and evaluate them. My work also includes retrieval and LLM-based systems, secure integration into clinical workflows, and applied research.
now_community: >-
  I also stay involved with DataPhilly and the local data community.
work:
  - title: CHIME
    url: https://github.com/CodeForPhilly/chime
    description: CHIME is the COVID-19 Hospital Impact Model for Epidemics. It's an open-source tool developed collaboratively to help hospitals plan for capacity needs during the pandemic.
  - title: Applied clinical AI
    description: >-
      I work with a team to evaluate and deploy practical clinical ML and AI systems. I also co-authored a [2026 study of AI-generated draft replies to patient portal messages](https://pubmed.ncbi.nlm.nih.gov/42361849/).
  - title: DataPhilly
    url: https://dataphilly.com/
    description: I co-founded DataPhilly. Through talks and workshops, I help connect people in Philadelphia who are curious about data.
quests:
  - description: Experimenting with an LLM-generated reinforcement-learning curriculum.
  - description: Local generative-image and video experiments on Apple Silicon.
  - description: A 4K-remaster workflow involving video processing and upscaling.
    url: https://github.com/mdbecker/4k_remaster
